# God of War VR mod - settings. One key and value per line, lines starting with # are notes.
# The mod reads this file when the game starts and notices edits saved while the game runs.
# A key that is not listed here uses its built-in default. The mod adds its own keys
# (for example the learned weapon grips) - leave those alone.

# VR starts by itself as soon as the game starts. 0 starts flat (press F9 for VR).
autovr=1

# Size of the HUD in the headset: third person, and first person.
ui_scale=0.35
ui_scale_fp=0.5
# Sharp HUD: the game's HUD drawn at full resolution, then scaled down. 0 turns it off.
sharp_ui=1
# A separate DLSS history for each eye (no smearing around characters). Only matters with DLSS on.
dlss_per_eye=1

# Which controller the game sees: 0 Xbox (Xbox button prompts), 1 PlayStation (PlayStation button prompts).
# F10 / F11 switch it in game, and the choice is kept.
pad_mode=0
# The game's rumble on the VR controllers: strength (0 turns it off), and how much of the other motor each hand gets.
rumble_strength=1.0
rumble_mix=0.5

# PlayStation VR2 controllers: the angle of Kratos' wrists, degrees (F5 / F6 change it in game).
wristpitch_psvr2=25
# Other controllers (Index, Vive, ...): the same angle.
wristpitch_other=5

# First person: where the view sits relative to Kratos' eyes, metres (forward, right, down).
fp_forward=0.2
fp_right=0.04
fp_down=-0.10
# F7 in first person: 1 shows only the arms, 0 the whole body.
hide_body=0
# First person combat: how close a swing must come to hit, metres (weapon, bare fists).
hit_radius=1.0
hit_radius_fist=0.5

# Menus, videos and loading screens are shown on a flat screen in front of you (metres).
screen_dist=2.2
screen_width=3.4

# ---- Learned by the mod - leave these alone ----
# Which way the right stick turns the game's camera.
camsync_sign=-1
